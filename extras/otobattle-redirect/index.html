<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 公開先が決まったら、下の 3 か所の URL（NEW_URL と同じもの）を書き換える -->
    <meta http-equiv="refresh" content="0; url=https://lutelute.github.io/onpu_beat_flash/#/game/battle?from=otobattle" />

    <style>
      :root { color-scheme: light dark; --bg: #f6f3ec; --ink: #1f1d1a; --sub: #6b665d; --tone: #b8325a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #17161a; --ink: #ece8e0; --sub: #a49e93; --tone: #f27a9b; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font: 16px/1.7 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
      main { max-width: 30rem; padding: 24px 16px; text-align: center; }
      h1 { font-size: 1.3rem; margin: 0 0 .5rem; }
      p { margin: .4rem 0; color: var(--sub); }
      a { color: var(--tone); font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>オトバトルは「音符ビートフラッシュ」に引っ越しました</h1>

      <p><a id="go" href="https://lutelute.github.io/onpu_beat_flash/#/game/battle?from=otobattle">新しいオトバトルを開く</a></p>
    </main>
    <script>
      // 前の版の設定（戦い方は「四方から」、ステージは「だんだん広がる」）で開く
      var NEW_URL = 'https://lutelute.github.io/onpu_beat_flash/#/game/battle?from=otobattle';
      location.replace(NEW_URL);
    </script>
  </body>
</html>
